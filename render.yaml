services:
  - type: web
    name: deeksha-portfolio
    runtime: node
    region: singapore
    autoDeployTrigger: checksPass
    plan: 0.5c-512mb
    buildCommand: npm ci --omit=dev
    preDeployCommand: npm run db:migrate && npm run db:seed
    startCommand: npm start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: DATABASE_SSL
        value: disable
      - key: DATABASE_URL
        fromDatabase:
          name: deeksha-portfolio-db
          property: connectionString
databases:
  - name: deeksha-portfolio-db
    plan: 0.1c-256mb
    region: singapore
    postgresMajorVersion: "17"
    diskSizeGB: 1
    ipAllowList: []
    databaseName: portfolio
    user: portfolio
